name: I have an idea
description: Suggest something that would make Mintr better for you.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to make or do?
      description: Tell us about the project, and where Mintr gets in the way today.
      placeholder: I make drawer labels for my workshop, and I have to resize every one by hand.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Your idea, in your own words.
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Pictures, sketches or examples.
